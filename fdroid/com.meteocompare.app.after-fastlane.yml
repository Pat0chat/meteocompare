# Use this shape after a tagged release contains fastlane/metadata/android.
# Keep the Builds entry for the first build already accepted by F-Droid; the
# F-Droid auto-update bot can append newer Builds entries from subsequent tags.

Categories:
  - Weather
License: Apache-2.0
AuthorName: Pat0chat
SourceCode: https://github.com/Pat0chat/MeteoCompare
IssueTracker: https://github.com/Pat0chat/MeteoCompare/issues
Changelog: https://github.com/Pat0chat/MeteoCompare/releases
Liberapay: Pat0chat

AntiFeatures:
  TetheredNet:
    en-US: Weather and geocoding data are fetched from the public Open-Meteo service; changing the backend currently requires modifying the app.
    fr-FR: Les données météo et de géocodage proviennent du service public Open-Meteo ; changer de backend nécessite actuellement de modifier l’application.

RepoType: git
Repo: https://github.com/Pat0chat/MeteoCompare.git

Builds:
  - versionName: 1.7.0
    versionCode: 22
    commit: v1.7.0
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: 'Tags ^v[0-9]+\.[0-9]+\.[0-9]+$'
CurrentVersion: 1.7.0
CurrentVersionCode: 22

MaintainerNotes: |-
  The public Open-Meteo server software is open source and self-hostable.
  MeteoCompare currently hard-codes Open-Meteo endpoints, therefore TetheredNet
  is declared rather than NonFreeNet.

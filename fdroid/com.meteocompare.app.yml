# AutoUpdateMode: Version v%v
#   → à chaque nouveau tag `v<X.Y.Z>` matchant versionName, F-Droid génère
#     automatiquement un nouveau bloc Builds. Le suffixe `v%v` réplique le
#     préfixe `v` utilisé dans tes tags git (v1.0.0, v1.1.0, ...) — sans ce
#     suffixe, F-Droid chercherait un tag "1.0.0" et échouerait.
# UpdateCheckMode: Tags ^v
#   → regex qui filtre les tags à ceux commençant par `v` (évite qu'un tag
#     hors versioning comme `test-branch` déclenche une release).
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v
CurrentVersion: 1.0.0
CurrentVersionCode: 10
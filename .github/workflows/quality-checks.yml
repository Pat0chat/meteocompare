name: Quality checks (Python, JVM, Android)

on:
  pull_request:
  push:
    branches: [master, meteogram]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python static-contract and validator tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Python checks (no pytest required)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/validate-compose-previews.py
          python3 scripts/check_android_strings.py
          python3 scripts/verify_atmospheric_localizations.py
          bash scripts/validate-fdroid-metadata.sh

  android-jvm:
    name: JVM tests, lint and androidTest compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          COMPILE_SDK="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["compileSdk"])')"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;36.0.0"
      - name: Compile and run JVM suite and compile all instrumented tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug

  android-device:
    name: Run androidTest on API 35 emulator
    needs: [python, android-jvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests without external network fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Preserve failing device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

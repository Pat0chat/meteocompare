name: Quality checks (Python, JVM, Android)

on:
  pull_request:
  push:
    branches: [master, meteogram]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Les trois familles de contrôles démarrent en même temps : l'émulateur,
# le plus long, n'attend plus la fin des jobs Python et JVM, et il est
# lui-même réparti sur deux machines. Le rapport consolidé attend tout le monde.
jobs:
  python:
    name: Python checks
    uses: ./.github/workflows/reusable-python-checks.yml
    with:
      artifact-name: quality-python-test-log

  android-jvm:
    name: JVM tests, lint and androidTest compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      - name: Compile and run JVM suite and compile all instrumented tests
        run: |
          set -euo pipefail
          # Une erreur de telechargement du plugin KSP peut etre transitoire.
          # Ne retenter QUE cette erreur, jamais un test ou une compilation en echec.
          if ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug 2>&1 | tee gradle-quality.log; then
            exit 0
          fi
          if grep -Fq "Plugin [id: 'com.google.devtools.ksp'" gradle-quality.log; then
            echo "::warning::KSP plugin introuvable lors de la resolution : nouvel essai avec metadonnees rafraichies"
            ./gradlew --no-daemon --refresh-dependencies :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug 2>&1 | tee -a gradle-quality.log
          else
            exit 1
          fi
      - name: Diagnose Maven Central if the Gradle build failed
        if: failure()
        shell: bash
        run: |
          # Diagnostic non bloquant, seulement si la resolution KSP a echoue.
          if ! grep -Fq "Plugin [id: 'com.google.devtools.ksp'" gradle-quality.log 2>/dev/null; then
            exit 0
          fi
          KSP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["ksp"])')"
          curl --silent --show-error --location --output /dev/null \
            --write-out 'KSP plugin marker Maven Central: HTTP %{http_code}\n' \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/${KSP_VERSION}/com.google.devtools.ksp.gradle.plugin-${KSP_VERSION}.pom" || true
      - name: Preserve Gradle build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gradle-failure-log
          path: gradle-quality.log
          if-no-files-found: ignore

      - name: Show JVM and corpus test counts
        if: always()
        run: python3 scripts/report_test_results.py --require-corpus both --summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve JUnit XML for consolidated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-unit-test-results
          path: app/build/test-results/
          if-no-files-found: warn

  android-device:
    name: Android instrumentation
    uses: ./.github/workflows/reusable-android-device-tests.yml
    with:
      artifact-name: androidTest-reports
      shards: '[1, 2]'

  test-report:
    name: Consolidated test report (unit, Android and corpus)
    needs: [python, android-jvm, android-device]
    if: always()
    uses: ./.github/workflows/reusable-test-report.yml
    with:
      unit-artifact: quality-unit-test-results
      android-artifact-prefix: androidTest-reports
      python-artifact: quality-python-test-log
      report-artifact-name: quality-consolidated-test-report

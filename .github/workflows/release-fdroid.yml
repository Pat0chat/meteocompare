name: Build & release APK (F-Droid) + AAB (Play Store)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Permission minimale nécessaire pour créer / mettre à jour une GitHub Release.
permissions:
  contents: write

concurrency:
  group: fdroid-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build signed reproducible APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Vérifie que gradle-wrapper.jar est bien un wrapper Gradle officiel.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Sous Windows, le bit exécutable Unix de gradlew peut être facile à perdre.
      # Ce chmod garantit qu'il sera exécutable sur le runner Linux.
      - name: Make Gradle Wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          COMPILE_SDK="$(
            python3 - <<'PY'
          import tomllib
          with open("gradle/libs.versions.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["versions"]["compileSdk"])
          PY
          )"

          echo "compileSdk=${COMPILE_SDK}"
          echo "sdkmanager=${SDKMANAGER}"

          # AGP 9.4 utilise Build Tools 36 pour construire.
          # Build Tools 34 est installé séparément uniquement pour apksigner,
          # car F-Droid recommande apksigner 34 pour les reproducible builds.
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0"

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          "${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner" version

      - name: Validate repository release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-compose-previews.py
          scripts/validate-fdroid-metadata.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      # IMPORTANT :
      # On NE fournit AUCUN secret de signature à Gradle.
      # Ton app/build.gradle.kts produira donc app-release-unsigned.apk.
      # Cela évite que Gradle/AGP signe l’APK avec apksigner 36.
      # L’AAB sera signé ensuite avec jarsigner et le même keystore.
      - name: Validate tests and lint, then build unsigned release APK/AAB
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f keystore.properties ]]; then
            echo "::error::keystore.properties ne doit pas être présent dans le dépôt/runner."
            exit 1
          fi

          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-build-cache \
            --no-configuration-cache \
            --stacktrace \
            clean \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify Android 16 KiB page-size compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*-unsigned.apk" -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" -print -quit)"
          if [[ -z "$APK" || -z "$AAB" ]]; then
            echo "::error::Artefacts release APK/AAB introuvables pour le contrôle 16 KiB."
            exit 1
          fi
          python3 scripts/verify-16kb-page-size.py --apk "$APK" --aab "$AAB"

      - name: Locate unsigned APK/AAB and choose release filenames
        id: release_artifacts
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name "*-unsigned.apk" \
              -print \
              -quit
          )"

          UNSIGNED_AAB="$(
            find app/build/outputs/bundle/release \
              -maxdepth 1 \
              -type f \
              -name "*.aab" \
              -print \
              -quit
          )"

          if [[ -z "$UNSIGNED_APK" || ! -f "$UNSIGNED_APK" ]]; then
            echo "::error::APK release non signé introuvable."
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          if [[ -z "$UNSIGNED_AAB" || ! -f "$UNSIGNED_AAB" ]]; then
            echo "::error::Android App Bundle release introuvable."
            find app/build/outputs/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Le tag doit être de la forme v1.2.3."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_SHA::7}"
          fi

          SIGNED_APK="${RUNNER_TEMP}/MeteoCompare-${VERSION}.apk"
          SIGNED_AAB="${RUNNER_TEMP}/MeteoCompare-${VERSION}.aab"

          echo "unsigned_apk=${UNSIGNED_APK}" >> "$GITHUB_OUTPUT"
          echo "unsigned_aab=${UNSIGNED_AAB}" >> "$GITHUB_OUTPUT"
          echo "signed_apk=${SIGNED_APK}" >> "$GITHUB_OUTPUT"
          echo "signed_aab=${SIGNED_AAB}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Unsigned APK: ${UNSIGNED_APK}"
          echo "Unsigned AAB: ${UNSIGNED_AAB}"
          echo "Final APK:    ${SIGNED_APK}"
          echo "Final AAB:    ${SIGNED_AAB}"

      - name: Verify APK version matches Git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          APKANALYZER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer"
          UNSIGNED_APK="${{ steps.release_artifacts.outputs.unsigned_apk }}"
          EXPECTED_VERSION="${{ steps.release_artifacts.outputs.version }}"

          if [[ ! -x "$APKANALYZER" ]]; then
            APKANALYZER="$(command -v apkanalyzer)"
          fi

          APK_VERSION="$("$APKANALYZER" manifest version-name "$UNSIGNED_APK" | tr -d '\r\n')"

          echo "Tag version: ${EXPECTED_VERSION}"
          echo "APK version: ${APK_VERSION}"

          if [[ "$APK_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Le versionName de l'APK (${APK_VERSION}) ne correspond pas au tag v${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          chmod 600 "${RUNNER_TEMP}/release.jks"

          # Vérification basique : keytool doit pouvoir ouvrir le fichier.
          test -s "${RUNNER_TEMP}/release.jks"

      - name: Sign APK with apksigner 34
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"
          UNSIGNED_APK="${{ steps.release_artifacts.outputs.unsigned_apk }}"
          SIGNED_APK="${{ steps.release_artifacts.outputs.signed_apk }}"

          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::Un ou plusieurs secrets de signature sont absents."
            exit 1
          fi

          # On signe directement l'APK produit par assembleRelease :
          # pas de repack, pas de zip supplémentaire, pas d'Android Studio.
          cp "$UNSIGNED_APK" "$SIGNED_APK"

          "$APKSIGNER" sign \
            --ks "${RUNNER_TEMP}/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            "$SIGNED_APK"

      - name: Verify APK signature and F-Droid signing key
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"
          SIGNED_APK="${{ steps.release_artifacts.outputs.signed_apk }}"

          # Clé actuellement déclarée dans fdroiddata pour com.meteocompare.app.
          EXPECTED_SHA256="f7b0432751cd0d183c62a40beb989574b488b290f63889fc177c5f93dfee2ab3"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          ACTUAL_SHA256="$(
            "$APKSIGNER" verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':[:space:]'
          )"

          echo "Signer SHA-256: ${ACTUAL_SHA256}"

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::La clé de signature ne correspond pas à AllowedAPKSigningKeys de F-Droid."
            exit 1
          fi

          sha256sum "$SIGNED_APK"

      # Un AAB est une archive signée au format JAR : apksigner ne sait pas signer
      # les bundles. jarsigner utilise la même clé de production que l'APK.
      - name: Sign Android App Bundle with jarsigner
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED_AAB="${{ steps.release_artifacts.outputs.unsigned_aab }}"
          SIGNED_AAB="${{ steps.release_artifacts.outputs.signed_aab }}"

          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::Un ou plusieurs secrets de signature AAB sont absents."
            exit 1
          fi

          jarsigner \
            -keystore "${RUNNER_TEMP}/release.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -digestalg SHA-256 \
            -signedjar "$SIGNED_AAB" \
            "$UNSIGNED_AAB" \
            "$KEY_ALIAS"

      - name: Verify Android App Bundle signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNED_AAB="${{ steps.release_artifacts.outputs.signed_aab }}"
          SIGNED_APK="${{ steps.release_artifacts.outputs.signed_apk }}"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"
          test -s "$SIGNED_AAB"

          # jarsigner -verify retourne aussi 0 pour un JAR non signé :
          # contrôler explicitement son message de succès.
          VERIFY_OUTPUT="$(jarsigner -verify "$SIGNED_AAB")"
          printf '%s\n' "$VERIFY_OUTPUT"
          if ! grep -Fxq 'jar verified.' <<< "$VERIFY_OUTPUT"; then
            echo "::error::L'AAB n'est pas correctement signé."
            exit 1
          fi

          # La clé de l'AAB doit être la même que celle de l'APK vérifié.
          APK_CERT="$("$APKSIGNER" verify --print-certs "$SIGNED_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"
          AAB_CERT="$(keytool -printcert -jarfile "$SIGNED_AAB" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"
          if [[ -z "$APK_CERT" || "$AAB_CERT" != "$APK_CERT" ]]; then
            echo "::error::Le certificat de l'AAB diffère de celui de l'APK."
            exit 1
          fi

          sha256sum "$SIGNED_AAB"

      - name: Upload signed APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: MeteoCompare-${{ steps.release_artifacts.outputs.version }}
          path: |
            ${{ steps.release_artifacts.outputs.signed_apk }}
            ${{ steps.release_artifacts.outputs.signed_aab }}
          if-no-files-found: error
          retention-days: 30

      # Sur un tag vX.Y.Z, conserver le nom exact de l'APK attendu par F-Droid :
      # https://github.com/Pat0chat/meteocompare/releases/download/v%v/MeteoCompare-%v.apk
      # Publier l'AAB signé à côté, pour la distribution Google Play.
      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.release_artifacts.outputs.signed_apk }}"
          AAB="${{ steps.release_artifacts.outputs.signed_aab }}"
          test -s "$APK"
          test -s "$AAB"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} déjà existante : remplacement de l'APK et de l'AAB."
            gh release upload "$TAG" "$APK" "$AAB" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Création de la release ${TAG}."
            gh release create "$TAG" "$APK" "$AAB" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi

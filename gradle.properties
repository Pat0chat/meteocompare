org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 active par défaut uniquement les tests unitaires du build type testé
# (debug dans ce projet), ce qui supprime la tâche testReleaseUnitTest.
# MeteoCompare conserve volontairement les tests JVM pour debug ET release.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official
